openapi: 3.0.3
info:
  title: STC — Módulo 6: Control de Acceso en Puertas y Registro de Auditoría API
  version: 1.1.0
  description: |
    Contrato oficial **OpenAPI 3.0.3** del **Módulo 6 (Validator App & Audit Ledger)** integrado con el **Módulo 5 (Wallet & QR Dinámico)**.

    ### Componentes Criptográficos del Sistema
    1. **Autenticación de Operadores (`PBKDF2-HMAC-SHA512` + `PIN 2FA` + `JWT ES256`)**: Derivación con 210,000 iteraciones y salt de 128 bits, comparación en tiempo constante (`timingSafeEqual`), candado de sesión única por dispositivo (`HTTP 409`) y token JWT firmado con `ECDSA P-256` (`secp256r1`).
    2. **Verificación Instantánea de Firma Digital (`ECDSA P-256` / `IEEE P1363`)**: Validación del boleto con la llave pública `PK_event` (exportada en `JWK` y `PEM`) sobre el JSON canónico (`canonicalize`).
    3. **Validación de QR Dinámico M5 (`ticketId.ventana.mac`)**: Ventanas TOTP de 15 segundos (`tolerancia ±1`) y `Base64URL(HMAC-SHA256(SK_session, UTF-8(ticketId + "|" + ventana)))`.
    4. **Control Anti-Passback Atómico y Libro Mayor Inmutable (`SHA-256 Hash-Chain`)**: Transición condicional atómica `ISSUED ➔ USED` en PostgreSQL/MySQL y encadenamiento criptográfico de cada escaneo al hash `SHA-256` del bloque anterior.

servers:
  - url: http://localhost:4000
    description: Servidor local (PC)
  - url: http://172.20.10.3:4000
    description: Servidor en red local / Hotspot Wi-Fi (App Móvil Expo)

tags:
  - name: Access Validation (Módulo 6)
    description: Validación en sub-segundo de códigos QR dinámicos en puertas y torniquetes.
  - name: Audit Ledger & Occupancy (Módulo 6)
    description: Libro mayor de auditoría inmutable (SHA-256 Hash-Chain) y estadísticas de aforo en tiempo real.
  - name: PKI & Scanner Auth (Módulo 1 ➔ 6)
    description: Autenticación criptográfica de operadores, bloqueo multi-dispositivo y llave pública PKI (JWK / PEM).
  - name: Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
    description: Sincronización de boletos con la Wallet del Módulo 5 y simulador de QR dinámico.

paths:
  /api/access/validate:
    post:
      tags:
        - Access Validation (Módulo 6)
      summary: Validar un código QR dinámico escaneado en puerta/torniquete
      description: |
        Recibe la cadena del código QR generado por el Módulo 5 (`ticketId.ventana.mac`) o un contenedor JSON `QrEnvelope`.
        Ejecuta en sub-segundo:
        1. Verificación del `JWT ES256` del operador (si se incluye `Authorization: Bearer`).
        2. Búsqueda de `ticketId` y verificación de firma `ECDSA P-256` (`IEEE P1363`) con `PK_event`.
        3. Recálculo en tiempo constante (`timingSafeEqual`) de `Base64URL(HMAC-SHA256(SK_session, ticketId|ventana))`.
        4. Verificación de ventana temporal de 15s con tolerancia `±1`.
        5. Actualización atómica `ISSUED ➔ USED` y registro en el Libro Mayor `SHA-256 Hash-Chain`.
      security:
        - ScannerBearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessValidationRequest'
            examples:
              FormatoCompactoModulo5:
                summary: Formato Oficial Módulo 5 (ticketId.ventana.mac)
                value:
                  qrData: "BOL-001.119714978.b8hSJkshPIHsVRN-7v2S04AqWRBZD-qG3gGKJjXF2Jc"
                  gateId: PUERTA-NORTE-01
                  scannerId: IPHONE-IOS-A1B2
              FormatoJsonExtendido:
                summary: Contenedor JSON QrEnvelope (retrocompatible)
                value:
                  qrData:
                    v: 1
                    p:
                      ticketId: BOL-001
                      event: Concierto Magistral Cripto-Sinfónico 2026
                      date: "15/11/2026"
                      seat: A12
                      titular: Usuario de prueba (Módulo 5)
                    sig: FIRMA_IEEE_P1363_BASE64URL
                    ts: 119714978
                    hmac: b8hSJkshPIHsVRN-7v2S04AqWRBZD-qG3gGKJjXF2Jc
                  gateId: TORNIQUETE-VIP-02
                  scannerId: IPHONE-IOS-A1B2
      responses:
        '200':
          description: Resultado determinista en sub-segundo (`VALID`, `REPLAY`, `FAKE` o `ALREADY_USED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessValidationResponse'
              examples:
                ValidResponse:
                  summary: 1. Boleto Válido (VALID)
                  value:
                    status: VALID
                    title: ACCESO VÁLIDO — ADELANTE
                    message: "Acceso autorizado en PUERTA-NORTE-01. Firma ECDSA P-256 (P1363) y QR dinámico M5 (ventana #119714978) verificados."
                    latencyMs: 0.92
                    cryptoChecks:
                      ecdsaVerified: true
                      hmacVerified: true
                      totpWindowValid: true
                      curve: P-256 (secp256r1)
                    ticket:
                      ticketId: BOL-001
                      buyerName: Usuario de prueba (Módulo 5)
                      section: VIP
                      row: A
                      seat: "12"
                      usedAt: "2026-11-26T20:24:31.000Z"
                      usedGate: PUERTA-NORTE-01
                ReplayResponse:
                  summary: 2. Ataque Replay (REPLAY — QR Expirado)
                  value:
                    status: REPLAY
                    title: ATAQUE REPLAY DETECTADO (QR EXPIRADO)
                    message: "Ataque Replay detectado: La ventana TOTP (#119714970) expiró hace ~120s (tolerancia ±1 ventana de 15s). Captura de pantalla rechazada."
                    latencyMs: 0.51
                    cryptoChecks:
                      ecdsaVerified: true
                      hmacVerified: true
                      totpWindowValid: false
                      curve: P-256 (secp256r1)
                      stepDrift: 8
                FakeResponse:
                  summary: 3. Boleto Falso (FAKE — Firma ECDSA o HMAC inválido)
                  value:
                    status: FAKE
                    title: BOLETO FALSO (HMAC DINÁMICO INVÁLIDO)
                    message: "Firma ECDSA válida, pero el MAC dinámico Base64URL(HMAC-SHA256(SK_session, ticketId|ventana)) es inválido. El emisor no posee SK_session."
                    latencyMs: 0.51
                    cryptoChecks:
                      ecdsaVerified: true
                      hmacVerified: false
                      totpWindowValid: false
                      curve: P-256 (secp256r1)
                AlreadyUsedResponse:
                  summary: 4. Boleto Ya Utilizado (ALREADY_USED — Anti-Passback)
                  value:
                    status: ALREADY_USED
                    title: YA INGRESÓ (BOLETO UTILIZADO)
                    message: "Doble ingreso rechazado (Anti-Passback): Este boleto ya registró entrada en PUERTA-NORTE-01 a las 2:24:31 p.m.."
                    latencyMs: 0.59
                    cryptoChecks:
                      ecdsaVerified: true
                      hmacVerified: true
                      totpWindowValid: true
                      curve: P-256 (secp256r1)
        '400':
          description: Petición inválida (`qrData` ausente).
        '401':
          description: Token JWT del operador inválido, expirado o revocado.

  /api/audit/dashboard:
    get:
      tags:
        - Audit Ledger & Occupancy (Módulo 6)
      summary: Obtener estadísticas de aforo en tiempo real y libro mayor de auditoría
      responses:
        '200':
          description: Resumen de aforo por sección, contadores de seguridad, estado de la cadena SHA-256 y últimos bloques.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditDashboardResponse'

  /api/audit/verify-chain:
    get:
      tags:
        - Audit Ledger & Occupancy (Módulo 6)
      summary: Verificar criptográficamente la integridad de la cadena de hashes SHA-256
      responses:
        '200':
          description: Reporte de integridad desde el bloque Génesis (`0000...0000`) hasta el último bloque.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainIntegrityReport'

  /api/auth/login:
    post:
      tags:
        - PKI & Scanner Auth (Módulo 1 ➔ 6)
      summary: Autenticación segura de operador (PBKDF2-HMAC-SHA512 + PIN 2FA + Sesión Única + JWT ES256)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorLoginRequest'
      responses:
        '200':
          description: Operador autenticado y token JWT ES256 emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorLoginResponse'
        '401':
          description: Credenciales o PIN 2FA inválidos.
        '409':
          description: Conflicto de sesión concurrente (`ALREADY_LOGGED_IN_OTHER_DEVICE`).
        '429':
          description: Cuenta bloqueada temporalmente por protección anti-fuerza bruta (5 intentos fallidos).

  /api/auth/session-status/{username}:
    get:
      tags:
        - PKI & Scanner Auth (Módulo 1 ➔ 6)
      summary: Consultar si un operador ya cuenta con una sesión activa en algún dispositivo
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: operador@ticketmaster.mx
        - name: scannerId
          in: query
          required: false
          schema:
            type: string
          example: IPHONE-IOS-A1B2
      responses:
        '200':
          description: Estado actual de la sesión del operador.

  /api/auth/me:
    get:
      tags:
        - PKI & Scanner Auth (Módulo 1 ➔ 6)
      summary: Verificar el token JWT ES256 de la sesión activa del operador
      security:
        - ScannerBearerAuth: []
      responses:
        '200':
          description: Datos decodificados y verificados del JWT activo.
        '401':
          description: Token ausente, expirado o revocado.

  /api/auth/logout:
    post:
      tags:
        - PKI & Scanner Auth (Módulo 1 ➔ 6)
      summary: Cerrar sesión y revocar criptográficamente el JTI del token JWT
      security:
        - ScannerBearerAuth: []
      responses:
        '200':
          description: Sesión liberada y JTI revocado.

  /api/pki/public-key:
    get:
      tags:
        - PKI & Scanner Auth (Módulo 1 ➔ 6)
      summary: Obtener la llave pública ECDSA P-256 en formatos JWK (para Web Crypto M5) y PEM
      responses:
        '200':
          description: Llave pública `publicKeyJwk`, `publicKeyPem` y huella X.509 SHA-256.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PkiPublicKeyResponse'

  /api/wallet/export:
    get:
      tags:
        - Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
      summary: Exportar boletos y llave pública JWK en la estructura exacta de la Wallet del Módulo 5
      responses:
        '200':
          description: Objeto `{ tickets, publicKeyJwk }` compatible 1:1 con el Módulo 5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module5WalletBundle'

  /api/wallet/sync:
    post:
      tags:
        - Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
      summary: Sincronizar boletos emitidos por Módulo 4 o el prototipo de Módulo 5 hacia el validador Módulo 6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Module5WalletBundle'
      responses:
        '200':
          description: Boletos registrados en la base de datos del validador.

  /api/tickets:
    get:
      tags:
        - Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
      summary: Listar todos los boletos registrados y su estado de ingreso
      responses:
        '200':
          description: Padrón de boletos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items:
                      $ref: '#/components/schemas/TicketRecord'
    post:
      tags:
        - Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
      summary: Emitir un nuevo boleto firmado con ECDSA P-256 (IEEE P1363)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - buyerName
              properties:
                buyerName:
                  type: string
                  example: Sofía Ramírez
                buyerEmail:
                  type: string
                  example: sofia.ramirez@stc.mx
                section:
                  type: string
                  enum: [VIP, Preferente, General, Palcos]
                  default: VIP
                row:
                  type: string
                  example: B
                seat:
                  type: string
                  example: "12"
      responses:
        '201':
          description: Boleto creado y firmado digitalmente.

  /api/tickets/{ticketId}/reset:
    post:
      tags:
        - Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
      summary: Restaurar un boleto al estado ISSUED (disponible)
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
          example: BOL-001
      responses:
        '200':
          description: Boleto restaurado.

  /api/tickets/reset-all:
    post:
      tags:
        - Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
      summary: Restaurar todos los boletos al estado ISSUED
      responses:
        '200':
          description: Todos los boletos fueron restaurados.

  /api/simulator/qr/{ticketId}:
    get:
      tags:
        - Wallet Integration & Simulator (Módulos 4 y 5 ➔ 6)
      summary: Generar el QR dinámico (ticketId.ventana.mac) en modo válido o de prueba de ataque
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
          example: BOL-001
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [VALID, REPLAY, FAKE_SIGNATURE, FAKE_HMAC]
            default: VALID
      responses:
        '200':
          description: Cadena QR `ticketId.ventana.mac`, DataURL Base64 y metadatos TOTP de 15s.

  /api/health:
    get:
      tags:
        - PKI & Scanner Auth (Módulo 1 ➔ 6)
      summary: Estado operativo del servidor, hora NTP, IP LAN y motor de base de datos activo
      responses:
        '200':
          description: Estado del nodo validador.

components:
  securitySchemes:
    ScannerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (ES256 P-256)

  schemas:
    PublicKeyJwk:
      type: object
      required: [kty, crv, x, y]
      properties:
        kty:
          type: string
          example: EC
        crv:
          type: string
          example: P-256
        x:
          type: string
          example: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
        y:
          type: string
          example: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0

    Module5TicketItem:
      type: object
      required: [ticketId, event, date, seat, titular, skSession, signatureECDSA]
      properties:
        ticketId:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          example: BOL-001
        event:
          type: string
          example: Concierto Magistral Cripto-Sinfónico 2026
        date:
          type: string
          example: "15/11/2026"
        seat:
          type: string
          example: A12
        titular:
          type: string
          example: Usuario de prueba
        status:
          type: string
          example: ACTIVO
        skSession:
          type: string
          description: Clave simétrica de 256 bits en Base64URL sin '=' para HMAC-SHA256.
        signatureECDSA:
          type: string
          description: Firma ECDSA P-256 en formato IEEE P1363 (64 bytes en Base64URL sin '=') sobre canonicalize({ date, event, seat, ticketId, titular }).

    Module5WalletBundle:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Module5TicketItem'
        publicKeyJwk:
          $ref: '#/components/schemas/PublicKeyJwk'

    OperatorLoginRequest:
      type: object
      required: [username, password, pin]
      properties:
        username:
          type: string
          example: operador@ticketmaster.mx
        password:
          type: string
          example: Ticketmaster#2026
        pin:
          type: string
          example: "2026"
        gateId:
          type: string
          example: PUERTA-NORTE-01
        scannerId:
          type: string
          example: IPHONE-IOS-A1B2
        forceRelease:
          type: boolean
          default: false
          description: Si es true (y las credenciales + PIN 2FA son válidos), revoca la sesión previa en otro dispositivo.

    OperatorLoginResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        operator:
          type: object
          properties:
            operatorId:
              type: string
              example: STAFF-01
            name:
              type: string
              example: Carlos Mendoza
            email:
              type: string
            badgeRole:
              type: string
            gateId:
              type: string
            scannerId:
              type: string
        security:
          type: object
          properties:
            jwtToken:
              type: string
            jti:
              type: string
            singleDeviceLockActive:
              type: boolean
            tokenType:
              type: string
              example: Bearer
            signatureAlgorithm:
              type: string
              example: ES256 (ECDSA secp256r1 / NIST P-256)
            passwordKdf:
              type: string
              example: PBKDF2-HMAC-SHA512 (210,000 iteraciones + 128-bit Salt)
            twoFactorPinVerified:
              type: boolean
            authComputeMs:
              type: number

    AccessValidationRequest:
      type: object
      required:
        - qrData
      properties:
        qrData:
          oneOf:
            - type: string
              description: Cadena compacta del Módulo 5 en formato `ticketId.ventana.mac` (o string JSON).
              example: "BOL-001.119714978.b8hSJkshPIHsVRN-7v2S04AqWRBZD-qG3gGKJjXF2Jc"
            - type: object
              description: Objeto QrEnvelope retrocompatible.
        gateId:
          type: string
          default: PUERTA-NORTE-01
        scannerId:
          type: string
          default: SCANNER-EXPO-01

    AccessValidationResponse:
      type: object
      properties:
        status:
          type: string
          enum: [VALID, REPLAY, FAKE, ALREADY_USED]
        title:
          type: string
        message:
          type: string
        latencyMs:
          type: number
        cryptoChecks:
          type: object
          properties:
            ecdsaVerified:
              type: boolean
            hmacVerified:
              type: boolean
            totpWindowValid:
              type: boolean
            curve:
              type: string
              example: P-256 (secp256r1)
        ticket:
          type: object
          nullable: true
          properties:
            ticketId:
              type: string
            buyerName:
              type: string
            section:
              type: string
            row:
              type: string
            seat:
              type: string
            usedAt:
              type: string
              nullable: true
            usedGate:
              type: string
              nullable: true
        auditBlock:
          $ref: '#/components/schemas/AuditBlock'

    AuditBlock:
      type: object
      properties:
        blockIndex:
          type: integer
        timestampIso:
          type: string
          format: date-time
        gateId:
          type: string
        scannerId:
          type: string
        ticketId:
          type: string
        eventId:
          type: string
        section:
          type: string
        seatLabel:
          type: string
        validationResult:
          type: string
          enum: [VALID, REPLAY, FAKE, ALREADY_USED]
        reason:
          type: string
        ecdsaValid:
          type: boolean
        hmacValid:
          type: boolean
        totpStep:
          type: integer
          nullable: true
        latencyMs:
          type: number
        prevHash:
          type: string
        blockHash:
          type: string

    ChainIntegrityReport:
      type: object
      properties:
        intact:
          type: boolean
        totalBlocks:
          type: integer
        genesisHash:
          type: string
        latestHash:
          type: string
        verifiedAt:
          type: string
          format: date-time
        corruptedAtBlock:
          type: integer
          nullable: true
        reason:
          type: string
          nullable: true

    AuditDashboardResponse:
      type: object
      properties:
        occupancy:
          type: object
          properties:
            totalCapacity:
              type: integer
            ticketsIssued:
              type: integer
            checkedInCount:
              type: integer
            remainingIssuedToEnter:
              type: integer
            capacityOccupancyPercent:
              type: number
            checkInRatePercent:
              type: number
            sections:
              type: array
              items:
                type: object
                properties:
                  section:
                    type: string
                  capacity:
                    type: integer
                  issued:
                    type: integer
                  inside:
                    type: integer
                  occupancyPercent:
                    type: number
        securityCounters:
          type: object
          properties:
            totalScans:
              type: integer
            validEntries:
              type: integer
            replayBlocked:
              type: integer
            fakeRejected:
              type: integer
            alreadyUsedBlocked:
              type: integer
            avgLatencyMs:
              type: number
        chainIntegrity:
          $ref: '#/components/schemas/ChainIntegrityReport'
        recentLedger:
          type: array
          items:
            $ref: '#/components/schemas/AuditBlock'

    PkiPublicKeyResponse:
      type: object
      properties:
        keyId:
          type: string
          example: PKI-CA-EVENT-2026-01
        curve:
          type: string
          example: P-256 (secp256r1)
        publicKeyJwk:
          $ref: '#/components/schemas/PublicKeyJwk'
        publicKeyPem:
          type: string
        certificateFingerprint:
          type: string

    TicketRecord:
      type: object
      properties:
        ticketId:
          type: string
        eventId:
          type: string
        section:
          type: string
        row:
          type: string
        seat:
          type: string
        buyerName:
          type: string
        buyerEmail:
          type: string
        buyerHash:
          type: string
        ecdsaSignature:
          type: string
        status:
          type: string
          enum: [ISSUED, USED, REVOKED]
        usedAt:
          type: string
          nullable: true
        usedGate:
          type: string
          nullable: true
        issuedAt:
          type: string
          format: date-time
